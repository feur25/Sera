name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            lib: libseraplot.so
            out: seraplot-linux-x64.so
          - os: macos-latest
            name: macos-x64
            lib: libseraplot.dylib
            out: seraplot-macos-x64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build native cdylib (ffi + js)
        run: cargo build --release --features ffi,js

      - name: Rename artifact
        run: cp target/release/${{ matrix.lib }} ${{ matrix.out }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: ${{ matrix.out }}

  release:
    needs: [wheels, native]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: SeraPlot ${{ github.ref_name }}
          generate_release_notes: true
