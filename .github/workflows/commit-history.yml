name: Update Commit History Graph

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install seraplot playwright
          playwright install --with-deps chromium

      - name: Generate graph
        run: python tools/commit_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/commit-history.html docs/theme/images/commit-history-preview.png docs/theme/images/commit-history.svg README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly commit-history graph refresh"
          git push
