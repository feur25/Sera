[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "seraplot"
version = "2.8.5"
description = "Rust data visualization framework - The modern Plotly alternative"
readme = "PYPI_README.md"
requires-python = ">=3.8"
authors = [{name = "Quentin", email = "feur09@gmail.com"}]
license = {text = "MIT"}

[project.urls]
Homepage = "https://feur25.github.io/Sera/getting-started/intro-seraplot.html"
Repository = "https://github.com/feur25/Sera"
Documentation = "https://feur25.github.io/Sera/"
Issues = "https://github.com/feur25/Sera/issues"

[tool.maturin]
features = ["python", "webapp", "sysmon", "telemetry-http"]
python-source = "python"
